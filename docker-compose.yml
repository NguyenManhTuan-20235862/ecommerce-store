services:
  # ─── Backend (Node.js + Express) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibe-backend
    restart: unless-stopped
    env_file: ./backend/.env.docker
    volumes:
      - ./backend/uploads:/app/uploads   # ảnh upload vẫn nằm ở máy host
    ports:
      - "5000:5000"

  # ─── Frontend (Nginx phục vụ React build) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibe-frontend
    restart: unless-stopped
    ports:
      - "80:80"         # truy cập tại http://localhost
    depends_on:
      - backend
